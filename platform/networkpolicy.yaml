---
# Default-deny ingress for the namespace, then explicit allows.
#
# Note on probes: with OVN-Kubernetes, kubelet health probes originate from the
# node and are permitted regardless of NetworkPolicy, so a default-deny policy
# does not break Artifactory's liveness/readiness/startup probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jfrog-jcr-default-deny-ingress
  namespace: jfrog-jcr
  labels:
    app.kubernetes.io/part-of: jfrog-container-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Artifactory's microservices (frontend, jfbus, router) and PostgreSQL all talk
# to each other inside the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jfrog-jcr-allow-same-namespace
  namespace: jfrog-jcr
  labels:
    app.kubernetes.io/part-of: jfrog-container-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# External traffic arrives only via the Route, i.e. from the ingress routers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jfrog-jcr-allow-ingress-controller
  namespace: jfrog-jcr
  labels:
    app.kubernetes.io/part-of: jfrog-container-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  podSelector:
    matchLabels:
      app: artifactory
      component: artifactory
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8082
---
# Prometheus scraping and the console's metrics views.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jfrog-jcr-allow-monitoring
  namespace: jfrog-jcr
  labels:
    app.kubernetes.io/part-of: jfrog-container-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
