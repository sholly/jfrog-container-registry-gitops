apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Synced by bootstrap/root-application.yaml (the app-of-apps). Everything here
# lands in the openshift-gitops namespace, where the ArgoCD instance watches.
namespace: openshift-gitops

resources:
  - appproject.yaml
  - application-platform.yaml
  - application-registry.yaml
