---
# Created here, in the platform wave, rather than by the Helm chart, so the SCC
# RoleBinding below always has a subject to bind and the names are stable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jfrog-jcr
  namespace: jfrog-jcr
  labels:
    app.kubernetes.io/name: artifactory
    app.kubernetes.io/part-of: jfrog-container-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jfrog-jcr-postgresql
  namespace: jfrog-jcr
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: jfrog-container-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
automountServiceAccountToken: false
